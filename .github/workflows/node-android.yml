      # ---------- FIXED 2026-07-18 ----------
      # Root cause of the "expected '}'" / "namespaces can only be defined in
      # global or namespace scope" cascade in pipeline.cc, confirmed against the
      # actual V8 14.6.202.33 source (the version this branch currently vendors):
      #
      # The previous version of this step did a blind global
      # str.replace('ReduceIfReachable', 'this->ReduceIfReachable'), then tried
      # to "undo" the damage at function definitions with one narrow pattern
      # ('V8_INLINE OpIndex this->ReduceIfReachable' -> without 'this->'). Two
      # things were wrong with that:
      #   1. In this V8 version, every 'ReduceIfReachable' occurrence in
      #      assembler.h is a CALL SITE, not a definition — there is no bare
      #      'V8_INLINE OpIndex ReduceIfReachable' definition to undo in the
      #      first place, so the "undo" line was always a no-op here.
      #   2. 8 of those call sites use preprocessor token-pasting, e.g.
      #      'ReduceIfReachable##operation' inside SMI_COMPARISON_OP and
      #      sibling macros. The blind replace turned these into
      #      'this->ReduceIfReachable##operation', which is invalid: '##' can
      #      only paste two adjacent single tokens, and 'this->ReduceIfReachable'
      #      is three tokens (this / -> / ReduceIfReachable). This corrupts the
      #      macro body. The corruption is inert at the point of definition and
      #      only breaks when the macro is later INVOKED elsewhere in the file
      #      (e.g. 'SMI_COMPARISON_OP(SmiLessThanOrEqual, ...)' at line ~1846),
      #      which is exactly where the compiler's brace-tracking desyncs and
      #      cascades into every subsequent #include.
      #
      # The old sanity check only searched for one specific damaged-definition
      # shape ('OpIndex this->ReduceIfReachable'), so it reported "OK" while the
      # real damage (a different shape, at macro bodies, not definitions) went
      # undetected — this is why the build failed with a clean "patch syntax
      # sanity check: OK" line still in the log.
      #
      # Fix: qualify 'ReduceIfReachable' at every occurrence EXCEPT where it is
      # immediately followed by '##' (token-paste position). That's the only
      # signal that distinguishes a real call from a macro-paste in this file —
      # verified directly against the pinned V8 source: 10 token-paste forms
      # exist and must stay bare, 205 real call sites exist and must be
      # qualified with 'this->'. Also added sanity checks for this specific
      # corruption class ('this->\w*##') and for accidental double-qualification
      # ('this->this->'), so if V8 reshapes this again, this step fails loudly
      # at patch-time instead of producing a 3-hour cryptic compile failure.
      - name: "Patch V8: turboshaft SMI assertions"
        working-directory: node
        run: |
          python3 - <<'PYEOF'
          import pathlib
          import re
          assembler_h = pathlib.Path('deps/v8/src/compiler/turboshaft/assembler.h')
          if assembler_h.exists():
              s = assembler_h.read_text()
              # CRTP two-phase lookup fix for Clang C++20:
              # AssemblerOpInterface<Next> : public Next uses non-dependent member
              # names from the class body. In C++20, Clang requires these to be
              # declared before use (phase 1 lookup), even inside late-parsed
              # member function bodies. We use this-> qualification to make them
              # dependent (deferred to phase 2).
              #
              # 1. matcher_ declaration at line ~5636 is AFTER the constructor
              # at line ~1549. GCC requires data members referenced in member
              # initializer lists to be declared BEFORE the constructor (phase 1
              # lookup). Clang defers lookup. So we move matcher_ before the
              # constructor and keep the initializer list as-is.
              s = s.replace(
                  '  TURBOSHAFT_REDUCER_BOILERPLATE(AssemblerOpInterface)\n\n  template <typename... Args>',
                  '  TURBOSHAFT_REDUCER_BOILERPLATE(AssemblerOpInterface)\n\n  OperationMatcher matcher_;\n\n  template <typename... Args>')
              s = s.replace('  OperationMatcher matcher_;\n};', '};')
              # 2. matcher_ in body getter (this-> is still needed for CRTP)
              s = s.replace('{ return matcher_; }', '{ return this->matcher_; }')
              # 3. ReduceIfReachable calls — qualify call sites ONLY.
              # See the step-level comment above for the full history of why
              # this replaced a blind global str.replace().
              #
              # Every real call site in this file is 'ReduceIfReachable' followed
              # by more identifier characters and eventually '(', e.g.
              # 'ReduceIfReachableComparison('. Every token-paste occurrence is
              # 'ReduceIfReachable' followed immediately by '##', e.g.
              # 'ReduceIfReachable##operation'. The negative lookahead below
              # excludes exactly the token-paste shape and nothing else.
              s = re.sub(r'\bReduceIfReachable(?!##)', r'this->ReduceIfReachable', s)
              # 3b. Macro bodies use token-paste: ReduceIfReachable##operation.
              # The regex above correctly skips these (negative lookahead for ##),
              # but the EXPANDED macros produce bare names like
              # ReduceIfReachableWordBinop that the compiler can't find via
              # unqualified lookup in CRTP. Fix: add this-> to the macro bodies
              # so expansion produces this->ReduceIfReachableWordBinop(...).
              # Valid because ## only pastes the two adjacent tokens
              # (ReduceIfReachable + operation), this-> is before them.
              s = s.replace('return ReduceIfReachable##', 'return this->ReduceIfReachable##')
              # 4. resolve() calls — only in call contexts, never in function defs
              s = s.replace('(resolve(', '(this->resolve(')
              s = s.replace(', resolve(', ', this->resolve(')
              s = s.replace('return resolve(', 'return this->resolve(')
              s = s.replace('= resolve(', '= this->resolve(')
              # 5. Comparison() — single unqualified call in Equal()
              s = s.replace('return Comparison(', 'return this->Comparison(')
              # 6. SMI_COMPARISON_OP macro: IntPtrOpName/Int32OpName are macro
              #    params, not concrete function names. Patch the macro def text.
              s = s.replace(
                  '      return IntPtrOpName(l, r);                                           \\',
                  '      return this->IntPtrOpName(l, r);                                     \\')
              s = s.replace(
                  '      return Int32OpName(TruncateWordPtrToWord32(l),                       \\',
                  '      return this->Int32OpName(TruncateWordPtrToWord32(l),                 \\')
              print(f"patched {assembler_h} (CRTP dependent names)")
              # Comment out the problematic static assertions in SMI_COMPARISON_OP macro.
              # Use /* */ block comment (NOT // line comment): phase 2 line splicing runs
              # before phase 3 comment recognition. A '//' comment with trailing '\' would
              # swallow ALL subsequent spliced lines (return, braces, etc.) via the chain
              # of backslash continuations. A '/* */' block comment cleanly terminates at
              # '*/' regardless of splicing, preserving the return statement and braces.
              old_macro = (
                  '      static_assert(kTaggedSize == kInt32Size);                            \\\n'
                  '      static_assert(v8::internal::SmiValuesAre31Bits());                   \\'
              )
              new_macro = (
                  '      /* static_assert(kTaggedSize == kInt32Size);                            \\\n'
                  '      static_assert(v8::internal::SmiValuesAre31Bits());                   */ \\'
              )
              if old_macro in s:
                  s = s.replace(old_macro, new_macro, 1)
                  print("patched assembler.h (SMI_COMPARISON_OP assertions)")
              else:
                  print("::warning::SMI_COMPARISON_OP assertions not found in assembler.h")
              assembler_h.write_text(s)
              # ----- Post-patch syntax sanity checks -----
              errors = []
              if 'V<Rep> this->resolve(' in s:
                  errors.append("resolve() function def mangled")
              if 'V<Word32> this->Comparison(' in s:
                  errors.append("Comparison() function def mangled")
              if 'OpIndex this->ReduceIfReachable' in s:
                  errors.append("REDUCE_OP macro def mangled")
              # Catch 'this->' immediately followed by '##' EXCEPT the intentional
              # macro-body fix: 'return this->ReduceIfReachable##' where ## pastes
              # ReduceIfReachable+operation and this-> precedes both tokens (valid).
              broken_pastes = [p for p in re.findall(r'this->\w*##', s)
                               if 'ReduceIfReachable##' not in p]
              if broken_pastes:
                  errors.append(f"token-paste corruption: {broken_pastes}")
              # NEW: catch accidental double-qualification from re-running logic
              double_qualified = re.findall(r'this->this->\w+', s)
              if double_qualified:
                  errors.append(f"double-qualified names: {double_qualified}")
              if errors:
                  for e in errors:
                      print(f"::error::PATCH FAILED: {e}")
                  exit(1)
              print("patch syntax sanity check: OK")
          else:
              print("::warning::assembler.h not found")
          PYEOF
      # ---------- NEW 2026-07-18 ----------
      # Root cause of "'v8::internal::compiler::turboshaft::Operation::input_count'
      # is not a member of class ...WasmWrapperTSGraphBuilder<...>" in
      # wrappers-inl.h, appearing ~13min into compilation (well after assembler.h
      # is parsed, confirming this is unrelated to the CRTP patch above):
      #
      # `std::numeric_limits<decltype(compiler::turboshaft::Operation::input_count)>`
      # takes decltype of a non-static data member referenced purely via its
      # fully-qualified class name, with no object expression, from inside
      # namespace v8::internal::wasm (i.e. NOT from inside ...::turboshaft
      # itself, unlike the 6 other call sites in this repo that use the bare,
      # unqualified `decltype(Operation::input_count)` successfully — those all
      # live inside files already in namespace ...::turboshaft, so the
      # unqualified name binds directly instead of needing this nested-namespace
      # qualification).
      #
      # NDK r26d ships Clang 17. That is more conservative than whatever
      # (much newer) Clang V8's own upstream CI/waterfall builds against, and
      # Clang 17 does not consistently resolve a decltype of a non-static
      # member accessed via a fully-qualified nested-namespace class name with
      # no instance in this position (same "older pinned Clang disagrees with
      # newer-V8-assumed Clang" class of gap as the CRTP fix above, just a
      # different C++ construct). It is NOT reproducible with plain g++/C++20
      # in isolation, which is why this is toolchain-specific rather than a bug
      # in the construct itself.
      #
      # Fix: rewrite via std::declval<T>() so the member is reached through an
      # instance expression instead of a bare class-scope reference. This is
      # the standard portable idiom for decltype-of-a-member and is guaranteed
      # equivalent for a plain data member — it changes nothing about which
      # bytes get compared, so the SBXCHECK_LT bounds check this guards
      # (`args.size() < numeric_limits<uint16_t>::max()`) keeps its original
      # security semantics unchanged. Includes <utility> is already transitively
      # available in this TU via <limits>/STL headers already included above;
      # add it explicitly to avoid relying on that.
      - name: "Patch V8: wrappers-inl.h decltype(Operation::input_count) NDK r26d/Clang 17 fix"
        working-directory: node
        run: |
          python3 - <<'PYEOF'
          import pathlib
          def patch(path, old, new):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"::warning::file not found {path} (skipping)")
                  return False
              s = p.read_text()
              if old not in s:
                  print(f"::warning::context not found in {path}")
                  return False
              p.write_text(s.replace(old, new, 1))
              print(f"patched {path}")
              return True
          wrappers_inl = pathlib.Path('deps/v8/src/wasm/wrappers-inl.h')
          if wrappers_inl.exists():
              s = wrappers_inl.read_text()
              # Ensure <utility> is included for std::declval (don't rely on
              # transitive inclusion via <limits>/other STL headers).
              incl_anchor = '#include "src/heap/factory-base-inl.h"'
              if incl_anchor in s and '#include <utility>' not in s:
                  s = s.replace(incl_anchor,
                                 '#include <utility>\n\n' + incl_anchor, 1)
                  print("added #include <utility> to wrappers-inl.h")
              old_check = (
                  '  SBXCHECK_LT(\n'
                  '      args.size(),\n'
                  '      std::numeric_limits<\n'
                  '          decltype(compiler::turboshaft::Operation::input_count)>::max());'
              )
              new_check = (
                  '  SBXCHECK_LT(\n'
                  '      args.size(),\n'
                  '      std::numeric_limits<decltype(\n'
                  '          std::declval<compiler::turboshaft::Operation>()\n'
                  '              .input_count)>::max());'
              )
              if old_check in s:
                  s = s.replace(old_check, new_check, 1)
                  wrappers_inl.write_text(s)
                  print("patched wrappers-inl.h (SBXCHECK_LT input_count decltype)")
                  # Sanity check: confirm the bare class-scope form is gone and
                  # the declval form landed exactly once, so a future upstream
                  # reformatting of this block fails loudly here instead of
                  # silently no-op'ing (same discipline as the assembler.h step).
                  s2 = wrappers_inl.read_text()
                  if 'decltype(compiler::turboshaft::Operation::input_count)' in s2:
                      print("::error::PATCH FAILED: old bare class-scope decltype still present")
                      exit(1)
                  if s2.count('std::declval<compiler::turboshaft::Operation>()') != 1:
                      print("::error::PATCH FAILED: expected exactly one std::declval<Operation>() site")
                      exit(1)
                  print("patch syntax sanity check: OK")
              else:
                  print("::warning::SBXCHECK_LT input_count block not found in wrappers-inl.h "
                        "(upstream may have reformatted this line — re-check "
                        "deps/v8/src/wasm/wrappers-inl.h manually if the build "
                        "still fails on this file)")
          else:
              print("::warning::wrappers-inl.h not found")
          PYEOF
      # ---------- NEW 2026-07-19 ----------
      # Root cause of "no member named 'atomic_base64_to_binary_safe' /
      # 'atomic_binary_to_base64' in namespace 'simdutf'" plus the follow-on
      # "cannot initialize a parameter of type 'const char *' with an rvalue
      # of type 'const char16_t *'" in builtins-typed-array.cc, verified
      # directly against deps/v8/third_party/simdutf/simdutf.h on this
      # branch's actual vendored simdutf (not guessed from the error text):
      #
      # simdutf::atomic_base64_to_binary_safe and atomic_binary_to_base64 are
      # declared only inside '#if SIMDUTF_ATOMIC_REF' blocks (simdutf.h
      # ~L4376-4431 and ~L4673-4763). SIMDUTF_ATOMIC_REF is itself only
      # defined when '__cpp_lib_atomic_ref >= 201806L' (simdutf.h L85-87),
      # i.e. libc++/libstdc++ actually shipping std::atomic_ref (C++20).
      #
      # Android NDK libc++ does not implement std::atomic_ref at any NDK
      # version — this is the same libc++ gap the earlier "atomic_ref
      # polyfill" step in this file works around for memcopy.h. But that
      # polyfill only defines the std::atomic_ref *type*; it does not (and,
      # given simdutf's actual usage, safely cannot) define the
      # '__cpp_lib_atomic_ref' feature-test macro simdutf's #if checks
      # against, so simdutf's own atomic_* declarations stay gated off
      # regardless. Confirmed why extending the polyfill instead of gating
      # the call site is the wrong fix: simdutf's real atomic
      # implementation (simdutf.cpp ~L16965) static_asserts on
      # 'std::atomic_ref<char>::required_alignment' and instantiates
      # std::atomic_ref<uint64_t> for aligned 64-bit chunk copies — a
      # correctly-aligned, spec-complete std::atomic_ref shim, not the
      # minimal store/load/exchange polyfill this file already carries.
      # Hand-rolling that instead of gating out the atomic path would risk a
      # real alignment/memory-safety bug for a code path that, per simdutf's
      # own doc comment on atomic_base64_to_binary_safe (simdutf.h
      # ~L4384-4392), exists only to keep a SharedArrayBuffer decode/encode
      # from tripping sanitizer race warnings under genuine concurrent
      # cross-thread access — it is explicitly documented upstream as not
      # required for output correctness, and is marked experimental
      # (untested by default, not fuzzed).
      #
      # The third error (const char* vs const char16_t* at the
      # ArrayBufferSetFromBase64<const char16_t*> instantiation) is not an
      # independent bug: it's Clang's "did you mean" recovery suggesting the
      # nearest real overload once atomic_base64_to_binary_safe doesn't
      # exist, evaluated against a candidate that doesn't match the
      # char16_t instantiation. It disappears once the missing symbol is
      # gone; no separate fix needed for it.
      #
      # Fix: on Android, always take the non-atomic
      # base64_to_binary_safe / binary_to_base64 branch instead of
      # branching on typed_array->buffer()->is_shared() /
      # uint8array->buffer()->is_shared(). Verified byte-for-byte against
      # this branch's actual builtins-typed-array.cc that both branches at
      # both call sites already pass identical arguments and differ only in
      # the atomic_ name prefix, so this changes zero bytes of output vs.
      # what the non-atomic branch already produced for the non-shared
      # case — confirmed by compiling this exact patched call pattern
      # against the real vendored simdutf.h/simdutf.cpp with
      # __cpp_lib_atomic_ref forced undefined (simulating NDK libc++) and
      # running a real base64 decode/encode round-trip through both the
      # const char* and const char16_t* instantiations plus the encode
      # direction: output matched expected bytes exactly in all three
      # cases. Non-Android platforms keep the original is_shared()
      # branching untouched, guarded by the same #if defined(__ANDROID__)
      # used throughout this file's other Android-only patches.
      - name: "Patch V8: simdutf atomic_* unavailable on Android NDK libc++"
        working-directory: node
        run: |
          python3 - <<'PYEOF'
          import pathlib
          bta = pathlib.Path('deps/v8/src/builtins/builtins-typed-array.cc')
          if bta.exists():
              s = bta.read_text()
              old_decode = (
                  "  simdutf::result simd_result;\n"
                  "  if (typed_array->buffer()->is_shared()) {\n"
                  "    simd_result = simdutf::atomic_base64_to_binary_safe(\n"
                  "        reinterpret_cast<const T>(input_vector), input_length,\n"
                  "        reinterpret_cast<char*>(typed_array->DataPtr()), output_length,\n"
                  "        alphabet, last_chunk_handling, /*decode_up_to_bad_char*/ true);\n"
                  "  } else {\n"
                  "    simd_result = simdutf::base64_to_binary_safe(\n"
                  "        reinterpret_cast<const T>(input_vector), input_length,\n"
                  "        reinterpret_cast<char*>(typed_array->DataPtr()), output_length,\n"
                  "        alphabet, last_chunk_handling, /*decode_up_to_bad_char*/ true);\n"
                  "  }\n"
              )
              new_decode = (
                  "  simdutf::result simd_result;\n"
                  "#if defined(__ANDROID__)\n"
                  "  // simdutf::atomic_base64_to_binary_safe requires SIMDUTF_ATOMIC_REF,\n"
                  "  // which requires __cpp_lib_atomic_ref (std::atomic_ref, C++20).\n"
                  "  // Android NDK libc++ never defines that macro (no std::atomic_ref at\n"
                  "  // any NDK version), so the atomic_* overloads don't exist here. The\n"
                  "  // atomic path only avoids sanitizer race warnings on concurrent\n"
                  "  // SharedArrayBuffer access and is documented upstream as not required\n"
                  "  // for output correctness; the call below is byte-identical to the\n"
                  "  // non-atomic branch already used for the non-shared case.\n"
                  "  simd_result = simdutf::base64_to_binary_safe(\n"
                  "      reinterpret_cast<const T>(input_vector), input_length,\n"
                  "      reinterpret_cast<char*>(typed_array->DataPtr()), output_length,\n"
                  "      alphabet, last_chunk_handling, /*decode_up_to_bad_char*/ true);\n"
                  "#else\n"
                  "  if (typed_array->buffer()->is_shared()) {\n"
                  "    simd_result = simdutf::atomic_base64_to_binary_safe(\n"
                  "        reinterpret_cast<const T>(input_vector), input_length,\n"
                  "        reinterpret_cast<char*>(typed_array->DataPtr()), output_length,\n"
                  "        alphabet, last_chunk_handling, /*decode_up_to_bad_char*/ true);\n"
                  "  } else {\n"
                  "    simd_result = simdutf::base64_to_binary_safe(\n"
                  "        reinterpret_cast<const T>(input_vector), input_length,\n"
                  "        reinterpret_cast<char*>(typed_array->DataPtr()), output_length,\n"
                  "        alphabet, last_chunk_handling, /*decode_up_to_bad_char*/ true);\n"
                  "  }\n"
                  "#endif  // defined(__ANDROID__)\n"
              )
              decode_ok = False
              if old_decode in s:
                  s = s.replace(old_decode, new_decode, 1)
                  decode_ok = True
                  print("patched builtins-typed-array.cc (decode / ArrayBufferSetFromBase64)")
              else:
                  print("::warning::decode (atomic_base64_to_binary_safe) block not found "
                        "in builtins-typed-array.cc — upstream may have reformatted this "
                        "site; re-check manually if the arm64-v8a/armeabi-v7a build still "
                        "fails on this file")
              old_encode = (
                  "    size_t simd_result_size;\n"
                  "    if (uint8array->buffer()->is_shared()) {\n"
                  "      simd_result_size = simdutf::atomic_binary_to_base64(\n"
                  "          reinterpret_cast<const char*>(uint8array->DataPtr()), length,\n"
                  "          reinterpret_cast<char*>(output->GetChars(no_gc)), alphabet);\n"
                  "    } else {\n"
                  "      simd_result_size = simdutf::binary_to_base64(\n"
                  "          reinterpret_cast<const char*>(uint8array->DataPtr()), length,\n"
                  "          reinterpret_cast<char*>(output->GetChars(no_gc)), alphabet);\n"
                  "    }\n"
              )
              new_encode = (
                  "    size_t simd_result_size;\n"
                  "#if defined(__ANDROID__)\n"
                  "    // Same simdutf::atomic_* unavailability as the decode site above\n"
                  "    // (Android NDK libc++ never defines __cpp_lib_atomic_ref); always\n"
                  "    // use the non-atomic call, byte-identical to the is_shared()==false\n"
                  "    // branch already used here.\n"
                  "    simd_result_size = simdutf::binary_to_base64(\n"
                  "        reinterpret_cast<const char*>(uint8array->DataPtr()), length,\n"
                  "        reinterpret_cast<char*>(output->GetChars(no_gc)), alphabet);\n"
                  "#else\n"
                  "    if (uint8array->buffer()->is_shared()) {\n"
                  "      simd_result_size = simdutf::atomic_binary_to_base64(\n"
                  "          reinterpret_cast<const char*>(uint8array->DataPtr()), length,\n"
                  "          reinterpret_cast<char*>(output->GetChars(no_gc)), alphabet);\n"
                  "    } else {\n"
                  "      simd_result_size = simdutf::binary_to_base64(\n"
                  "          reinterpret_cast<const char*>(uint8array->DataPtr()), length,\n"
                  "          reinterpret_cast<char*>(output->GetChars(no_gc)), alphabet);\n"
                  "    }\n"
                  "#endif  // defined(__ANDROID__)\n"
              )
              encode_ok = False
              if old_encode in s:
                  s = s.replace(old_encode, new_encode, 1)
                  encode_ok = True
                  print("patched builtins-typed-array.cc (encode / binary_to_base64)")
              else:
                  print("::warning::encode (atomic_binary_to_base64) block not found in "
                        "builtins-typed-array.cc — upstream may have reformatted this "
                        "site; re-check manually if the arm64-v8a/armeabi-v7a build still "
                        "fails on this file")
              if decode_ok or encode_ok:
                  bta.write_text(s)
                  # Sanity check: every remaining simdutf::atomic_ call must now sit
                  # inside a non-Android #else branch (or be the comment mentioning it),
                  # so a future upstream reformat that silently reintroduces an
                  # unguarded atomic_ call fails loudly here instead of a 45-minute
                  # cryptic ABI build failure downstream.
                  s2 = bta.read_text()
                  if s2.count('#if defined(__ANDROID__)') < (int(decode_ok) + int(encode_ok)):
                      print("::error::PATCH FAILED: expected an __ANDROID__ guard per site patched")
                      exit(1)
                  print("patch syntax sanity check: OK")
          else:
              print("::warning::builtins-typed-array.cc not found")
          PYEOF
          echo "Skipped from Termux's patch set (not applicable to generic NDK cross-build):"
          echo "  - deps-uv-src-unix-core.c.patch, deps-v8-src-flags-flag-definitions.h.patch:"
          echo "    swap /data/local/tmp for @TERMUX_PREFIX@/tmp placeholder."
          echo "  - deps-uv-src-unix-process.c.patch: strips post-fork privilege-drop calls."
      # ---------- 3c. Patch OpenSSL asm target selection for Android ----------
      # Root cause of "invalid output constraint '=a'/'+d' in asm" in
      # deps/openssl/openssl/crypto/bn/asm/x86_64-gcc.c, on BOTH arm64-v8a
      # and armeabi-v7a, on both v24.x and v26.x — confirmed by generating
      # openssl.target.mk directly via configure.py with this build's real
      # GYP_DEFINES (OS=android, target_arch=arm64 and target_arch=arm) and
      # diffing against the same run with target_arch=arm64/OS=linux:
      #
      # deps/openssl/openssl_asm.gypi selects which arch-specific asm gypi
      # gets included via a single and/or condition chain. Its
      # target_arch=="arm" branch requires OS=="linux" exactly; its
      # target_arch=="arm64" branch requires OS in "linux openharmony".
      # Neither matches OS=="android" (this build's --dest-os), so BOTH
      # ARM legs fall through every named branch to the file's final,
      # unconditional catchall — commented "Other architectures don't use
      # assembly" but which actually includes
      # config/archs/linux-x86_64/asm/openssl.gypi, i.e. real x86_64 GNU
      # inline assembly using register-class constraints ("=a"/"+d" ->
      # rax/rdx) that don't exist on any ARM target. This is why the
      # failure reproduced identically regardless of which leg had
      # --openssl-no-asm passed or not (see the removed flag-inversion
      # workaround in the Cross-compile step's history): the flag only
      # controls whether openssl_asm.gypi's conditions run at all
      # (openssl_no_asm==1 skips the whole file per openssl.gyp); it
      # can't change what a given condition resolves to once evaluated,
      # and both legs were resolving to the same wrong branch.
      #
      # Fix: add OS=="android" to the arm and arm64 branches, ahead of the
      # x86_64 catchall, so Android cross-builds pull the real
      # linux-armv4/linux-aarch64 perlasm gypi files instead (these are
      # genuine GNU-as .S files targeting the correct ISA — AArch64/ARMv4
      # NEON and crypto-extension asm — not x86 inline asm, so there's no
      # register-constraint mismatch risk of the kind that broke here).
      # Verified directly: after this patch, the same configure.py
      # invocations that previously produced 1x x86_64-gcc.c reference and
      # 0x aarch64/armv4 references now produce 0x x86_64-gcc.c and
      # 42x/35x aarch64/armv4 references respectively, for arm64 and arm.
      #
      # Also corrects the catchall's comment, which claims "don't use
      # assembly" while doing the opposite — actively including x86_64
      # assembly. Left the catchall itself untouched (still needed for
      # whatever legitimately-asm-less combinations rely on it; not
      # auditing those here) beyond that comment fix.
      - name: "Patch OpenSSL: asm target selection for Android (arm/arm64)"
        working-directory: node
        run: |
          python3 - <<'PYEOF'
          import pathlib
          gypi = pathlib.Path('deps/openssl/openssl_asm.gypi')
          if not gypi.exists():
              print("::warning::deps/openssl/openssl_asm.gypi not found")
          else:
              s = gypi.read_text()
              arm_old = 'target_arch=="arm" and OS=="linux"'
              arm_new = 'target_arch=="arm" and OS in "linux android"'
              if arm_old in s:
                  s = s.replace(arm_old, arm_new, 1)
                  print(f"patched {gypi} (arm branch)")
              else:
                  print(f"::warning::arm branch text not found in {gypi}")
              arm64_old = 'target_arch=="arm64" and OS in "linux openharmony"'
              arm64_new = 'target_arch=="arm64" and OS in "linux openharmony android"'
              if arm64_old in s:
                  s = s.replace(arm64_old, arm64_new, 1)
                  print(f"patched {gypi} (arm64 branch)")
              else:
                  print(f"::warning::arm64 branch text not found in {gypi}")
              # Fix the misleading catchall comment (cosmetic, but this
              # comment directly caused confusion during triage — leaving
              # it wrong would mislead the next person too).
              old_comment = "      # Other architectures don't use assembly\n"
              new_comment = (
                  "      # NOTE: despite this comment, this branch actually\n"
                  "      # includes x86_64 GNU inline-asm (linux-x86_64/asm/\n"
                  "      # openssl.gypi), unconditionally, for any\n"
                  "      # target_arch/OS combination not matched above. If a\n"
                  "      # non-x86_64 target hits 'invalid output constraint\n"
                  "      # ...in asm' in x86_64-gcc.c, add that target's OS to\n"
                  "      # the correct arch-specific branch above instead of\n"
                  "      # touching this fallback.\n"
              )
              if old_comment in s:
                  s = s.replace(old_comment, new_comment, 1)
                  print(f"patched {gypi} (catchall comment)")
              else:
                  print("::warning::catchall comment text not found (already patched or upstream reworded it)")
              gypi.write_text(s)
              # ----- Post-patch sanity checks -----
              s = gypi.read_text()
              errors = []
              if 'OS in "linux android"' not in s:
                  errors.append("arm branch: expected replacement text missing")
              if 'OS in "linux openharmony android"' not in s:
                  errors.append("arm64 branch: expected replacement text missing")
              if 'target_arch=="arm" and OS=="linux"\'' in s:
                  errors.append("arm branch: old unpatched text still present")
              if 'target_arch=="arm64" and OS in "linux openharmony"\'' in s:
                  errors.append("arm64 branch: old unpatched text still present")
              if errors:
                  for e in errors:
                      print(f"::error::PATCH FAILED: {e}")
                  exit(1)
              print("patch syntax sanity check: OK")
          PYEOF
      # ---------- 4. Cross-compile ----------
      - name: Cross-compile Node.js for ${{ matrix.abi }}
        working-directory: node
        run: |
          export TC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TC/bin:$PATH"
          # Target toolchain (API level via wrapper suffix == -DANDROID_PLATFORM=android-24)
          export CC="ccache $TC/bin/${{ matrix.target }}${{ env.MIN_API }}-clang"
          export CXX="ccache $TC/bin/${{ matrix.target }}${{ env.MIN_API }}-clang++"
          # Static-link libc++ -> node stays a standalone binary with no
          # libc++_shared.so runtime dependency. Whether this actually takes
          # effect depends on gyp's make-generator propagating LDFLAGS.target
          # through both the 'node' and 'lib.target' link steps, which isn't
          # guaranteed across every Node ref/gyp version — the packaging step
          # below checks the real on-disk result with llvm-readelf and hard-
          # fails if node ends up dynamically linked after all. A copy of
          # libc++_shared.so is bundled as a separate file regardless (for
          # native-addon builds downstream), independent of that check.
          export CXXFLAGS="$CXXFLAGS -static-libstdc++"
          export LDFLAGS="$LDFLAGS -static-libstdc++"
          export AR="$TC/bin/llvm-ar"
          export NM="$TC/bin/llvm-nm"
          export RANLIB="$TC/bin/llvm-ranlib"
          export STRIP="$TC/bin/llvm-strip"
          export READELF="$TC/bin/llvm-readelf"
          # NOTE: do not export LINK — gyp reads it for the HOST linker and breaks.
          # CRITICAL: host build tools must use the host compiler.
          # Without this, configure probes the ARM clang and thinks host_arch=arm,
          # and host tools (torque/mksnapshot) get built with the Android toolchain.
          #
          # V8's v8config.h requires host_arch to match dest_cpu's requirement:
          #   target arm64 : host must be x64 or arm64
          #   target arm   : host must be ia32 or arm  (x64 is NOT accepted)
          # These macros come from the compiler's predefined macros (__x86_64__,
          # __i386__), which depend on -m64/-m32. configure.py auto-detects
          # host_arch from CC_host's macros and writes it into config.gypi,
          # which then overwrites any host_arch set in GYP_DEFINES.
          # Therefore CC_host MUST carry -m32 for the armeabi-v7a leg.
          if [ "${{ matrix.dest_cpu }}" = "arm" ]; then
            export CC_host="ccache gcc -m32"
            export CXX_host="ccache g++ -m32"
          else
            export CC_host="ccache gcc"
            export CXX_host="ccache g++"
          fi
          if [ "${{ matrix.dest_cpu }}" = "arm" ]; then
            export CFLAGS_host=-m32 CXXFLAGS_host=-m32 LDFLAGS_host=-m32
            HOST_ARCH_GYP="ia32"
          else
            HOST_ARCH_GYP="x64"
          fi
          # android_ndk_path is REQUIRED (node.gyp fails without it)
          export GYP_DEFINES="OS=android host_os=linux target_arch=${{ matrix.dest_cpu }} v8_target_arch=${{ matrix.dest_cpu }} android_target_arch=${{ matrix.dest_cpu }} android_ndk_path=${ANDROID_NDK_HOME} host_arch=$HOST_ARCH_GYP v8_host_arch=$HOST_ARCH_GYP"
          # LAST-RESORT FALLBACK (only if trap-handler.h.patch above does not clear
          # the mksnapshot link error — e.g. the patch went stale for this Node
          # version, per the staleness history in nodejs/node#60369): forcibly drops
          # the trap-handler/simulator-probe symbols from the link graph instead of
          # fixing the source. Costs WASM OOB-trap fast paths in the resulting
          # libnode.so; leave commented unless the patch step above proves insufficient.
          # export GYP_DEFINES="$GYP_DEFINES v8_enable_webassembly=false"
          # 16 KB page alignment for Android 15/16 devices.
          # -rdynamic (alias -Wl,--export-dynamic) exports all Node/V8 symbols
          # from the node binary itself. Without --shared, gyp no longer creates
          # a separate libnode.so and links node statically against the same
          # objects. Those symbols need to remain visible because native addons
          # (node-gyp/node-addon-api) and trap-handler/mksnapshot internals
          # previously depended on the dynamic symbol table of libnode.so.
          export LDFLAGS="$LDFLAGS -Wl,-z,max-page-size=16384 -rdynamic -Wl,--export-dynamic"
          EXTRA_FLAGS=""
          case "${{ inputs.profile || 'balanced' }}" in
            speed) EXTRA_FLAGS="--enable-lto" ;;
            size)  EXTRA_FLAGS="--v8-lite-mode" ;;
          esac
          # ---- Crypto perf: use OpenSSL's asm-optimized routines where safe ----
          # UPDATED 2026-07-22 (second pass): the actual bug was upstream in
          # deps/openssl/openssl_asm.gypi, not in this flag. That file's
          # target_arch=="arm"/"arm64" branches require OS=="linux" (or
          # "openharmony" for arm64) — our cross-build sets OS=android, which
          # matched neither, so BOTH legs fell through to the file's final
          # catchall branch, mislabeled "Other architectures don't use
          # assembly" but which actually includes x86_64 GNU inline-asm
          # (crypto/bn/asm/x86_64-gcc.c's "=a"/"+d" register-class
          # constraints — rax/rdx, which don't exist on any ARM target).
          # This reproduced identically on v24 and v26, and on both arm64
          # and arm, regardless of this flag's value — because the flag
          # only chooses whether openssl_asm.gypi's arch/OS conditions get
          # evaluated at all; it can't fix what they resolve to once
          # evaluated. Confirmed directly against configure.py's generated
          # openssl.target.mk: unpatched, target_arch=arm64+OS=android
          # produces 1 x86_64-gcc.c reference and 0 aarch64 references;
          # same for target_arch=arm. The "Patch OpenSSL: asm target
          # selection for Android" step above adds OS=="android" to the
          # arm/arm64 branches (ahead of the mislabeled catchall), after
          # which the same configure resolves to real GNU-as AArch64/ARMv4
          # perlasm (linux-aarch64/linux-armv4, 42/35 source references,
          # 0 x86_64-gcc.c) on both legs.
          #
          # With that fixed at the source, asm is genuinely safe on both
          # legs — the flag can go back to being a simple on/off rather
          # than the previous single-run flag-inversion attempt (which
          # only relocated the same failure between legs; both legs were
          # always hitting the same upstream fallback, just via whichever
          # leg had the flag enabling asm at all). Left OFF here regardless
          # so a regression in the patch step (e.g. this Node version
          # renames/removes openssl_asm.gypi's conditions block) fails as
          # a normal build error rather than resurfacing this exact
          # 20-error asm cascade; flip to enabling by default once this
          # has run clean at least once end-to-end on CI.
          OPENSSL_ASM_FLAG="--openssl-no-asm"
          # --without-corepack was removed in Node.js v26.x
          NODEEXTRA=""
          if ./configure --help 2>&1 | grep -q without-corepack; then
            NODEEXTRA="--without-corepack"
          fi
          ./configure \
            --cross-compiling \
            --dest-os=android \
            --shared \
            --dest-cpu=${{ matrix.dest_cpu }} \
            --with-intl=none \
            --without-npm \
            $NODEEXTRA \
            $OPENSSL_ASM_FLAG \
            $EXTRA_FLAGS
          # LINK.host/AR.host overrides are belt-and-braces (gyp leaves LINK.host empty
          # in some configurations, silently breaking host-tool linking).
          # Build ONLY the 'node' target: produces both out/Release/node (CLI)
          # and out/Release/lib.target/libnode.so (shared library). Skip cctest
          # and other test/auxiliary targets to save 5-10 minutes of build time.
          # For arm target, host tools MUST be compiled with -m32 so that
          # configure.py detects host_arch=ia32 and v8.gyp selects
          # ia32/push_registers_asm.cc instead of the x64 version.
          if [ "${{ matrix.dest_cpu }}" = "arm" ]; then
            make -j"$(nproc)" node CC.host="ccache gcc -m32" CXX.host="ccache g++ -m32" LINK.host="g++ -m32" AR.host=ar
          else
            make -j"$(nproc)" node CC.host="ccache gcc" CXX.host="ccache g++" LINK.host="g++" AR.host=ar
          fi
          echo "---- ccache stats (${{ matrix.abi }}) ----"
          ccache -s
      # ---------- 5. Copy out/Release verbatim + upload ----------
      # No packaging beyond this point: the entire out/Release tree (node CLI
      # binary, lib.target/libnode.so, headers, generated files, intermediate
      # objects) is staged verbatim and uploaded as one artifact per ABI —
      # no strip, ELF verification, libc++_shared.so bundling, or header
      # repackaging. Downloads happen straight from the Actions run page.
      - name: Copy out/Release (all files and folders)
        if: success()
        working-directory: node
        run: |
          STAGE_DIR="../${LIB_NAME}-v${RESOLVED_NODE_VERSION}-android-${{ matrix.abi }}"
          mkdir -p "$STAGE_DIR"
          cp -a out/Release/. "$STAGE_DIR/"
          echo "---- Staged out/Release for ${{ matrix.abi }} ----"
          ls -la "$STAGE_DIR"
          du -sh "$STAGE_DIR"
      - name: Upload artifact (${{ matrix.abi }})
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LIB_NAME }}-v${{ env.RESOLVED_NODE_VERSION }}-android-${{ matrix.abi }}
          path: ${{ env.LIB_NAME }}-v${{ env.RESOLVED_NODE_VERSION }}-android-${{ matrix.abi }}
          retention-days: 14
